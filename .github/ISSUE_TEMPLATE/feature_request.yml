name: "Feature Request"
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Awesome! Please share details so we can understand the value and scope.
  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: A short description of the feature
      placeholder: e.g. Add support for Azure AKS deployments
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: Explain the problem this solves or why it improves the project
  - type: textarea
    id: approach
    attributes:
      label: Possible Implementation
      description: (Optional) Any thoughts on how this could be implemented?
