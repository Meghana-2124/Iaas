# Default values for chimoney-rafiki chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Global settings that can be accessed by all templates
global:
  environment: dev
  # Example: global.imagePullPolicy: IfNotPresent

rafikiAuth:
  enabled: true
  name: rafiki-auth
  image:
    repository: ghcr.io/interledger/rafiki-auth
    tag: v1.0.0-alpha.20
    pullPolicy: IfNotPresent
  replicaCount: 1
  ports:
    main: 3006
    grant: 3009
    admin: 3001
  service:
    type: ClusterIP
    ports:
      main: 3006
      grant: 3009
      admin: 3001
  secrets:
    name: rafiki-auth-secrets # Name of the K8s secret object
    # Secret data should be supplied externally, not in values.yaml for production.
    # Example structure for data (base64 encoded):
    # data:
    #   RAFIKI_AUTH_DATABASE_URL: "base64_encoded_value"
    #   RAFIKI_AUTH_IDENTITY_SERVER_SECRET: "base64_encoded_value"
  # env: # Non-sensitive environment variables
  #   NODE_ENV: "development"

rafikiBackend:
  enabled: true
  name: rafiki-backend
  image:
    repository: ghcr.io/interledger/rafiki-backend
    tag: v1.0.0-alpha.20
    pullPolicy: IfNotPresent
  replicaCount: 1
  ports:
    openPayments: 80
    graphql: 3001
    connector: 3002
    admin: 3003
    autopeering: 3004
  service:
    type: ClusterIP
    ports:
      openPayments: 80
      graphql: 3001
      connector: 3002
      admin: 3003
      autopeering: 3004
  secrets:
    name: rafiki-backend-secrets
    # data:
    #   RAFIKI_BACKEND_DATABASE_URL: "base64_encoded_value"

nginx:
  enabled: true
  name: nginx
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  ports:
    http: 80
  service:
    type: ClusterIP # Or ClusterIP if Ingress is the sole entry point
    port: 80
  configMap:
    name: nginx-conf
  config:
    serverNameIlp: "ilp.chimoney.com"
    serverNameAuth: "auth-ilp.chimoney.io"
    rafikiBackendServiceHost: "{{ .Release.Name }}-rafiki-backend" # Will be templated to use the correct service name
    rafikiAuthServiceHost: "{{ .Release.Name }}-rafiki-auth"
    # GraphQL allowed IPs (example, make this a list)
    graphqlAllowedIps:
      - "35.160.120.126"
      - "44.233.151.27"
      - "34.211.200.85"
      - "34.66.77.227"
    # Default Nginx config content will be in the configmap template

redis:
  enabled: true # Set to false if using an external Redis or a sub-chart
  name: redis
  image:
    repository: redis
    tag: 7
    pullPolicy: IfNotPresent
  replicaCount: 1
  ports:
    redis: 6379
  service:
    type: ClusterIP
    port: 6379

ingress:
  enabled: true # Set to false if Nginx service type is of LoadBalancer and is the preferred entry
  name: rafiki-ingress
  className: "alb" # For AWS ALB Ingress Controller
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    # alb.ingress.kubernetes.io/certificate-arn: # ARN for ACM certificate
  hosts:
    ilp:
      host: ilp.chimoney.com # Override per environment
      paths:
        - path: /
          pathType: Prefix
          serviceNameSuffix: "nginx" # Point to nginx service
          servicePort: 80 # Nginx service port
    auth:
      host: auth-ilp.chimoney.io # Override per environment
      paths:
        - path: /
          pathType: Prefix
          serviceNameSuffix: "nginx" # Point to nginx service
          servicePort: 80 # Nginx service port
  # tls: # Example TLS configuration
  #   - secretName: chimoney-tls-secret # K8s secret containing TLS cert and key
  #     hosts:
  #       - ilp.chimoney.com
  #       - auth-ilp.chimoney.io

# This section defines the names of secret objects to be created.
# The actual 'data' for secrets should be populated securely,
# e.g., via Pulumi's secret management, AWS Secrets Manager, or by providing
# a separate values file (e.g., secrets.yaml, gitignored) during Helm deployment.
# The secret templates will create empty secrets if data is not provided,
# which then need to be populated manually or by a CI/CD process.
# For Pulumi, you can pass secret values directly to the Helm chart resource.
kubernetesSecrets:
  rafikiAuth:
    create: true # Whether to create the secret object via Helm
    name: "{{ .Values.rafikiAuth.secrets.name }}" # Uses name from component config
    # data: {} # Populated by Pulumi or external means
  rafikiBackend:
    create: true
    name: "{{ .Values.rafikiBackend.secrets.name }}"
    # data: {}
