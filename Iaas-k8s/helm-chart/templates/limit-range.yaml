{{- if eq .Values.deploymentType "shared" }}
{{- if .Values.planTier }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "iaas-rafiki.fullname" . }}-tier-limit-range
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    iaas.deployment/tier: {{ .Values.planTier }}
    iaas.deployment/type: shared
spec:
  limits:
    # Pod-level limits
    - type: Pod
      max:
        cpu: {{ index .Values.planTier "limits" "cpu" | default "2000m" }}
        memory: {{ index .Values.planTier "limits" "memory" | default "4Gi" }}
      min:
        cpu: "100m"
        memory: "128Mi"
    # Container-level limits
    - type: Container
      max:
        cpu: {{ index .Values.planTier "limits" "cpu" | default "2000m" }}
        memory: {{ index .Values.planTier "limits" "memory" | default "4Gi" }}
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: {{ index .Values.planTier "requests" "cpu" | default "500m" }}
        memory: {{ index .Values.planTier "requests" "memory" | default "1Gi" }}
      defaultRequest:
        cpu: {{ index .Values.planTier "requests" "cpu" | default "500m" }}
        memory: {{ index .Values.planTier "requests" "memory" | default "1Gi" }}
    # PVC limits for persistent storage
    {{- if index .Values.planTier "storage" }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ index .Values.planTier "storage" "max" | default "20Gi" }}
      min:
        storage: "1Gi"
    {{- end }}
{{- end }}
{{- end }}
