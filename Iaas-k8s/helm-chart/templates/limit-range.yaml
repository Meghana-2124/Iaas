{{- if eq .Values.deploymentType "shared" }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "iaas-rafiki.fullname" . }}-tier-limit-range
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    {{- if .Values.planTier }}
    iaas.deployment/tier: {{ .Values.planTier }}
    {{- end }}
    iaas.deployment/type: shared
spec:
  limits:
    # Pod-level limits
    - type: Pod
      max:
        {{- if .Values.tierResourceQuota }}
        cpu: {{ .Values.tierResourceQuota.limits.cpu | default "2000m" }}
        memory: {{ .Values.tierResourceQuota.limits.memory | default "4Gi" }}
        {{- else }}
        cpu: "2000m"
        memory: "4Gi"
        {{- end }}
      min:
        cpu: "100m"
        memory: "128Mi"
    # Container-level limits
    - type: Container
      max:
        {{- if .Values.tierResourceQuota }}
        cpu: {{ .Values.tierResourceQuota.limits.cpu | default "2000m" }}
        memory: {{ .Values.tierResourceQuota.limits.memory | default "4Gi" }}
        {{- else }}
        cpu: "2000m"
        memory: "4Gi"
        {{- end }}
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        {{- if .Values.tierResourceQuota }}
        cpu: {{ .Values.tierResourceQuota.requests.cpu | default "500m" }}
        memory: {{ .Values.tierResourceQuota.requests.memory | default "1Gi" }}
        {{- else }}
        cpu: "500m"
        memory: "1Gi"
        {{- end }}
      defaultRequest:
        {{- if .Values.tierResourceQuota }}
        cpu: {{ .Values.tierResourceQuota.requests.cpu | default "500m" }}
        memory: {{ .Values.tierResourceQuota.requests.memory | default "1Gi" }}
        {{- else }}
        cpu: "500m"
        memory: "1Gi"
        {{- end }}
    # PVC limits for persistent storage
    - type: PersistentVolumeClaim
      max:
        storage: "20Gi"
      min:
        storage: "1Gi"
{{- end }}
