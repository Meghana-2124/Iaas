# Kubecost Installation Chart
# filepath: /Users/mide/Documents/work/Iaas/Iaas-k8s/helm-chart/templates/kubecost-installation.yaml

{{- if .Values.kubecost.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubecost
  labels:
    name: kubecost
    iaas.deployment/component: monitoring
    iaas.deployment/tier: {{ .Values.planTier | default "basic" }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost-cost-analyzer
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
    app.kubernetes.io/component: cost-analyzer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-config
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
data:
  # Kubecost configuration for tier-based allocation
  allocation-config.yaml: |
    allocations:
      - name: "tier-based"
        aggregateBy:
          - "label:iaas.deployment/tier"
          - "label:iaas.deployment/company"
        filters:
          namespace: ["default", "kube-system"]
      - name: "company-based"
        aggregateBy:
          - "label:iaas.deployment/company"
        shareIdle: true
        shareNamespaces:
          - "kube-system"
    
  # Tier-specific pricing configuration
  pricing-config.yaml: |
    tiers:
      basic:
        cpu: {{ .Values.kubecost.pricing.basic.cpu | default "0.031611" }}
        memory: {{ .Values.kubecost.pricing.basic.memory | default "0.004446" }}
        storage: {{ .Values.kubecost.pricing.basic.storage | default "0.04" }}
      standard:
        cpu: {{ .Values.kubecost.pricing.standard.cpu | default "0.031611" }}
        memory: {{ .Values.kubecost.pricing.standard.memory | default "0.004446" }}
        storage: {{ .Values.kubecost.pricing.standard.storage | default "0.04" }}
      premium:
        cpu: {{ .Values.kubecost.pricing.premium.cpu | default "0.031611" }}
        memory: {{ .Values.kubecost.pricing.premium.memory | default "0.004446" }}
        storage: {{ .Values.kubecost.pricing.premium.storage | default "0.04" }}
      enterprise:
        cpu: {{ .Values.kubecost.pricing.enterprise.cpu | default "0.031611" }}
        memory: {{ .Values.kubecost.pricing.enterprise.memory | default "0.004446" }}
        storage: {{ .Values.kubecost.pricing.enterprise.storage | default "0.04" }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-cost-analyzer
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
    app.kubernetes.io/component: cost-analyzer
    iaas.deployment/tier: {{ .Values.planTier | default "basic" }}
    iaas.deployment/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-analyzer
      app.kubernetes.io/instance: kubecost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cost-analyzer
        app.kubernetes.io/instance: kubecost
        app.kubernetes.io/component: cost-analyzer
        iaas.deployment/tier: {{ .Values.planTier | default "basic" }}
        iaas.deployment/component: monitoring
      annotations:
        kubecost.io/tier: {{ .Values.planTier | default "basic" }}
        kubecost.io/company: {{ .Values.companyName }}
    spec:
      serviceAccountName: kubecost-cost-analyzer
      containers:
      - name: cost-analyzer-frontend
        image: gcr.io/kubecost1/frontend:{{ .Values.kubecost.version | default "prod-1.108.1" }}
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
          name: http-ui
        resources:
          requests:
            cpu: 10m
            memory: 55Mi
          limits:
            cpu: 100m
            memory: 256Mi
        env:
        - name: GET_HOSTS_FROM
          value: dns
        volumeMounts:
        - name: kubecost-config
          mountPath: /var/configs

      - name: cost-analyzer-server
        image: gcr.io/kubecost1/server:{{ .Values.kubecost.version | default "prod-1.108.1" }}
        imagePullPolicy: Always
        ports:
        - containerPort: 9003
          name: http-api
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 800m
            memory: 2Gi
        env:
        - name: PROMETHEUS_SERVER_ENDPOINT
          value: {{ .Values.kubecost.prometheusUrl | default "http://prometheus-server.kubecost.svc.cluster.local:9090" }}
        - name: CLOUD_PROVIDER_API_KEY
          value: "AIzaSyDXQPG_MHUEy9neR7stolq6l0ujXmjJlvk"
        - name: CLUSTER_ID
          value: {{ .Values.kubecost.clusterId | default "shared-cluster" }}
        - name: KUBECOST_NAMESPACE
          value: kubecost
        - name: KUBECOST_TOKEN
          value: {{ .Values.kubecost.token | default "" }}
        - name: LOG_LEVEL
          value: {{ .Values.kubecost.logLevel | default "info" }}
        {{- if .Values.kubecost.billing.enabled }}
        - name: CONFIG_PATH
          value: /var/configs
        {{- end }}
        volumeMounts:
        - name: kubecost-config
          mountPath: /var/configs
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 30
          periodSeconds: 10

      {{- if .Values.kubecost.prometheus.enabled }}
      - name: cost-model
        image: gcr.io/kubecost1/cost-model:{{ .Values.kubecost.version | default "prod-1.108.1" }}
        imagePullPolicy: Always
        ports:
        - containerPort: 9003
          name: http-cost-model
        resources:
          requests:
            cpu: 200m
            memory: 55Mi
          limits:
            cpu: 800m
            memory: 256Mi
        env:
        - name: PROMETHEUS_SERVER_ENDPOINT
          value: {{ .Values.kubecost.prometheusUrl | default "http://prometheus-server.kubecost.svc.cluster.local:9090" }}
        - name: CLUSTER_ID
          value: {{ .Values.kubecost.clusterId | default "shared-cluster" }}
        - name: KUBECOST_NAMESPACE
          value: kubecost
        - name: LOG_LEVEL
          value: {{ .Values.kubecost.logLevel | default "info" }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: kubecost-config
          mountPath: /var/configs
      {{- end }}

      volumes:
      - name: kubecost-config
        configMap:
          name: kubecost-config

---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-cost-analyzer
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
    app.kubernetes.io/component: cost-analyzer
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9003"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.kubecost.service.type | default "ClusterIP" }}
  ports:
  - name: http-ui
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: http-api
    port: 9003
    targetPort: 9003
    protocol: TCP
  selector:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost

{{- if .Values.kubecost.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubecost-ingress
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
  annotations:
    {{- range $key, $value := .Values.kubecost.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.kubecost.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.kubecost.ingress.host }}
    secretName: {{ .Values.kubecost.ingress.tls.secretName | default "kubecost-tls" }}
  {{- end }}
  rules:
  - host: {{ .Values.kubecost.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubecost-cost-analyzer
            port:
              number: 9090
{{- end }}

{{- if .Values.kubecost.rbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecost-cost-analyzer
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "services", "persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecost-cost-analyzer
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecost-cost-analyzer
subjects:
- kind: ServiceAccount
  name: kubecost-cost-analyzer
  namespace: kubecost
{{- end }}

{{- if .Values.kubecost.alerts.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-alerts
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
data:
  alerts.yaml: |
    alerts:
      - name: "tier-budget-exceeded"
        description: "Tier budget has been exceeded"
        enabled: true
        threshold: {{ .Values.kubecost.alerts.budgetThreshold | default "100" }}
        aggregation: "tier"
        window: "1d"
        filters:
          - property: "tier"
            value: {{ .Values.planTier | default "basic" }}
        actions:
          - type: "webhook"
            webhook:
              url: {{ .Values.kubecost.alerts.webhookUrl | default "" }}
          {{- if .Values.kubecost.alerts.email.enabled }}
          - type: "email"
            email:
              to: {{ .Values.kubecost.alerts.email.to | toJson }}
              from: {{ .Values.kubecost.alerts.email.from | default "kubecost@example.com" }}
              subject: "Kubecost Alert: Tier Budget Exceeded"
          {{- end }}
      
      - name: "company-spend-anomaly"
        description: "Unusual spending pattern detected for company"
        enabled: true
        threshold: {{ .Values.kubecost.alerts.anomalyThreshold | default "150" }}
        aggregation: "company"
        window: "1d"
        filters:
          - property: "company"
            value: {{ .Values.companyName }}
        actions:
          - type: "webhook"
            webhook:
              url: {{ .Values.kubecost.alerts.webhookUrl | default "" }}
{{- end }}

{{- end }}
