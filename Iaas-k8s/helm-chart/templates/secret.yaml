{{- if and .Values.kubernetesSecrets .Values.kubernetesSecrets.rafikiAuth .Values.kubernetesSecrets.rafikiAuth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kubernetesSecrets.rafikiAuth.name }}
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $.Values.rafikiAuth.name }}
type: Opaque
stringData:
  {{- with .Values.kubernetesSecrets.rafikiAuth.stringData }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- else }}
  # Placeholder: Secrets data should be populated via Pulumi, --set, or a secure values file.
  # Example:
  # RAFIKI_AUTH_DATABASE_URL: "changeme" # Base64 encoded
  placeholder: "ensure_secrets_are_provided"
  {{- end }}
---
{{- end }}
{{- if and .Values.kubernetesSecrets .Values.kubernetesSecrets.rafikiBackend .Values.kubernetesSecrets.rafikiBackend.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kubernetesSecrets.rafikiBackend.name }}
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $.Values.rafikiBackend.name }}
type: Opaque
stringData:
  {{- with .Values.kubernetesSecrets.rafikiBackend.stringData }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- else }}
  # Placeholder: Secrets data should be populated via Pulumi, --set, or a secure values file.
  placeholder: "ensure_secrets_are_provided"
  {{- end }}
{{- end }}
