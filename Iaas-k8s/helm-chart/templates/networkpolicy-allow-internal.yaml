{{- if and .Values.deploymentType (eq .Values.deploymentType "shared") .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iaas-rafiki.fullname" . }}-allow-internal
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "iaas-rafiki.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from pods within the same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ include "iaas-rafiki.namespace" . }}
  # Allow traffic from ingress controllers (typically in different namespaces)
  {{- if .Values.networkPolicy.allowIngressFrom }}
  - from:
    {{- range .Values.networkPolicy.allowIngressFrom }}
    - namespaceSelector:
        matchLabels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
  {{- end }}
  egress:
  # Allow traffic to pods within the same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: {{ include "iaas-rafiki.namespace" . }}
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow egress to external services (databases, APIs, etc.)
  {{- if .Values.networkPolicy.allowEgressTo }}
  - to:
    {{- range .Values.networkPolicy.allowEgressTo }}
    {{- if .cidr }}
    - ipBlock:
        cidr: {{ .cidr }}
    {{- end }}
    {{- if .namespaceSelector }}
    - namespaceSelector:
        matchLabels:
          {{- toYaml .namespaceSelector | nindent 10 }}
    {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.allowEgressPorts }}
    ports:
    {{- range .Values.networkPolicy.allowEgressPorts }}
    - protocol: {{ .protocol | default "TCP" }}
      port: {{ .port }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
