{{- if and .Values.deploymentType (eq .Values.deploymentType "shared") .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iaas-rafiki.fullname" . }}-deny-all
  namespace: {{ include "iaas-rafiki.namespace" . }}
  labels:
    {{- include "iaas-rafiki.enhancedLabels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "iaas-rafiki.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  # Deny all traffic by default (no ingress/egress rules means deny all)
{{- end }}
