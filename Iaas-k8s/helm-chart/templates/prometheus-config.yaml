# Prometheus Configuration for Kubecost
# This template sets up Prometheus with optimal configuration for Kubecost cost monitoring

{{- if and .Values.kubecost.enabled .Values.kubecost.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kubecost
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kubecost-prometheus
    app.kubernetes.io/component: prometheus
    iaas.deployment/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.kubecost.prometheus.scrapeInterval | default "1m" }}
      evaluation_interval: {{ .Values.kubecost.prometheus.evaluationInterval | default "1m" }}
      external_labels:
        cluster: {{ .Values.kubecost.clusterId | default "shared-cluster" }}
        environment: {{ .Values.environment | default "production" }}
        tier: {{ .Values.planTier | default "basic" }}

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Kubecost cost-analyzer metrics
      - job_name: "kubecost"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kubecost
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kubecost-cost-analyzer
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-api
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
        scrape_interval: 1m
        scrape_timeout: 10s
        metrics_path: /metrics

      # Node exporter for node-level resource metrics
      - job_name: "node-exporter"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kubecost
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: prometheus-node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics
        scrape_interval: 30s
        scrape_timeout: 10s

      # Kubernetes API server metrics
      - job_name: "kubernetes-apiservers"
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_namespace,
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes for node-level metrics
      - job_name: "kubernetes-nodes"
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # Kubernetes pods with prometheus annotations
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # cAdvisor for container metrics
      - job_name: "kubernetes-cadvisor"
        kubernetes_sd_configs:
          - role: node
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # Keep only essential container metrics for cost calculation
          - source_labels: [__name__]
            regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_.*_bytes_total|fs_.*_bytes|spec_.*)"
            action: keep
          # Drop high cardinality labels
          - regex: "container_label_.*"
            action: labeldrop
          - regex: "image_id"
            action: labeldrop

      # Kubernetes service endpoints
      - job_name: "kubernetes-service-endpoints"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels:
              [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name

    {{- if .Values.kubecost.prometheus.remoteWrite.enabled }}
    # Remote write configuration for long-term storage
    remote_write:
      - url: {{ .Values.kubecost.prometheus.remoteWrite.url }}
        {{- if .Values.kubecost.prometheus.remoteWrite.basicAuth.enabled }}
        basic_auth:
          username: {{ .Values.kubecost.prometheus.remoteWrite.basicAuth.username }}
          password: {{ .Values.kubecost.prometheus.remoteWrite.basicAuth.password }}
        {{- end }}
        write_relabel_configs:
          - source_labels: [__name__]
            regex: "kubecost_.*|container_.*|node_.*|kube_.*"
            action: keep
    {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-storage-config
  namespace: kubecost
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kubecost-prometheus
    app.kubernetes.io/component: prometheus-storage
data:
  storage.yml: |
    # Prometheus storage configuration
    retention:
      time: {{ .Values.kubecost.prometheus.retention | default "30d" }}
      size: {{ .Values.kubecost.prometheus.retentionSize | default "50GB" }}
    
    tsdb:
      min_block_duration: {{ .Values.kubecost.prometheus.tsdb.minBlockDuration | default "2h" }}
      max_block_duration: {{ .Values.kubecost.prometheus.tsdb.maxBlockDuration | default "25h" }}
      wal_compression: {{ .Values.kubecost.prometheus.tsdb.walCompression | default true }}

{{- end }}
