# Prometheus Recording Rules for Kubecost Cost Allocation
# These rules pre-compute commonly used metrics for better performance

{{- if and .Values.kubecost.enabled .Values.kubecost.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-recording-rules
  namespace: kubecost
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kubecost-prometheus
    app.kubernetes.io/component: recording-rules
    iaas.deployment/component: monitoring
data:
  recording-rules.yml: |
    groups:
      - name: kubecost.cost_allocation
        interval: 30s
        rules:
          # CPU cost per core hour
          - record: kubecost:cpu_cost_per_core_hour
            expr: |
              avg(
                label_replace(
                  kube_node_status_capacity{resource="cpu"} * 
                  on(node) group_left() 
                  label_replace(
                    node_cpu_hourly_cost, "node", "$1", "instance", "(.+)"
                  ), "node", "$1", "node", "(.+)"
                )
              ) by (node)

          # Memory cost per GB hour
          - record: kubecost:memory_cost_per_gb_hour
            expr: |
              avg(
                label_replace(
                  kube_node_status_capacity{resource="memory"} * 
                  on(node) group_left() 
                  label_replace(
                    node_ram_hourly_cost, "node", "$1", "instance", "(.+)"
                  ), "node", "$1", "node", "(.+)"
                ) / (1024^3)
              ) by (node)

          # Pod CPU utilization aggregated by namespace
          - record: kubecost:namespace_cpu_usage
            expr: |
              sum(
                rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])
              ) by (namespace)

          # Pod memory utilization aggregated by namespace
          - record: kubecost:namespace_memory_usage
            expr: |
              sum(
                container_memory_working_set_bytes{container!="POD",container!=""}
              ) by (namespace) / (1024^3)

          # Storage cost calculations
          - record: kubecost:storage_cost_per_gb_hour
            expr: |
              avg(
                kube_persistentvolume_capacity_bytes * 
                on(persistentvolume) group_left() 
                pv_hourly_cost
              ) / (1024^3)

      - name: kubecost.resource_efficiency
        interval: 1m
        rules:
          # CPU efficiency by pod
          - record: kubecost:pod_cpu_efficiency
            expr: |
              (
                rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])
              ) / (
                container_spec_cpu_quota{container!="POD",container!=""} / 
                container_spec_cpu_period{container!="POD",container!=""}
              )

          # Memory efficiency by pod
          - record: kubecost:pod_memory_efficiency
            expr: |
              (
                container_memory_working_set_bytes{container!="POD",container!=""}
              ) / (
                container_spec_memory_limit_bytes{container!="POD",container!=""}
              )

          # Network cost allocation
          - record: kubecost:network_cost_per_gb
            expr: |
              {{ .Values.kubecost.networkCostPerGB | default "0.01" }}

      - name: kubecost.cluster_health
        interval: 30s
        rules:
          # Total cluster CPU capacity
          - record: kubecost:cluster_cpu_capacity
            expr: |
              sum(kube_node_status_capacity{resource="cpu"})

          # Total cluster memory capacity
          - record: kubecost:cluster_memory_capacity_gb
            expr: |
              sum(kube_node_status_capacity{resource="memory"}) / (1024^3)

          # Cluster CPU utilization percentage
          - record: kubecost:cluster_cpu_utilization_percent
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m]))
              ) / (
                sum(kube_node_status_capacity{resource="cpu"})
              ) * 100

          # Cluster memory utilization percentage
          - record: kubecost:cluster_memory_utilization_percent
            expr: |
              (
                sum(container_memory_working_set_bytes{container!="POD",container!=""})
              ) / (
                sum(kube_node_status_capacity{resource="memory"})
              ) * 100

          # Node availability
          - record: kubecost:node_availability_percent
            expr: |
              (
                count(up{job="kubernetes-nodes"} == 1)
              ) / (
                count(up{job="kubernetes-nodes"})
              ) * 100

      - name: kubecost.cost_optimization
        interval: 5m
        rules:
          # Idle CPU cost (allocated but not used)
          - record: kubecost:idle_cpu_cost_hourly
            expr: |
              sum(
                (
                  kube_pod_container_resource_requests{resource="cpu"} - 
                  on(pod, namespace) group_left() 
                  rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])
                ) * 
                on(node) group_left() 
                kubecost:cpu_cost_per_core_hour
              ) by (namespace)

          # Idle memory cost (allocated but not used)
          - record: kubecost:idle_memory_cost_hourly
            expr: |
              sum(
                (
                  kube_pod_container_resource_requests{resource="memory"} - 
                  on(pod, namespace) group_left() 
                  container_memory_working_set_bytes{container!="POD",container!=""}
                ) * 
                on(node) group_left() 
                kubecost:memory_cost_per_gb_hour / (1024^3)
              ) by (namespace)

          # Overprovisioned resources alert metric
          - record: kubecost:overprovisioned_resources
            expr: |
              count by (namespace) (
                kubecost:pod_cpu_efficiency < {{ .Values.kubecost.efficiency.cpuThreshold | default "0.5" }} OR
                kubecost:pod_memory_efficiency < {{ .Values.kubecost.efficiency.memoryThreshold | default "0.7" }}
              )

      - name: kubecost.billing_allocation
        interval: 1h
        rules:
          # Daily cost by namespace
          - record: kubecost:namespace_daily_cost
            expr: |
              (
                kubecost:namespace_cpu_usage * kubecost:cpu_cost_per_core_hour +
                kubecost:namespace_memory_usage * kubecost:memory_cost_per_gb_hour
              ) * 24

          # Monthly cost projection by namespace
          - record: kubecost:namespace_monthly_cost_projection
            expr: |
              kubecost:namespace_daily_cost * 30

          # Cost per tier allocation
          - record: kubecost:tier_cost_allocation
            expr: |
              sum(kubecost:namespace_daily_cost) by (tier)

{{- end }}
