# Prometheus ServiceMonitors for Kubecost
# This template creates ServiceMonitor resources for Prometheus to scrape metrics

{{- if and .Values.kubecost.enabled .Values.kubecost.prometheus.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubecost-cost-analyzer
  namespace: kubecost
  labels:
    app.kubernetes.io/name: cost-analyzer
    app.kubernetes.io/instance: kubecost
    app.kubernetes.io/component: cost-analyzer-monitor
    iaas.deployment/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-analyzer
      app.kubernetes.io/instance: kubecost
  namespaceSelector:
    matchNames:
      - kubecost
  endpoints:
  - port: http-api
    interval: 1m
    path: /metrics
    honorLabels: true
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'kubecost_.*'
      action: keep

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-server
  namespace: kubecost
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: kubecost-prometheus
    app.kubernetes.io/component: prometheus-monitor
    iaas.deployment/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: kubecost-prometheus
  namespaceSelector:
    matchNames:
      - kubecost
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    honorLabels: true

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-exporter
  namespace: kubecost
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: kubecost-node-exporter
    app.kubernetes.io/component: node-monitor
    iaas.deployment/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/instance: kubecost-node-exporter
  namespaceSelector:
    matchNames:
      - kubecost
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'node_.*'
      action: keep
{{- end }}
