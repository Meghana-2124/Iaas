# Default values for iaas-k8s Helm chart
# This configuration provides tier-based resource allocation and monitoring
# for Kubernetes environments without embedded cost management tools

# Global configuration
global:
  # Name of the company/organization
  companyName: "mycompany"
  
  # Default deployment tier (basic, standard, premium, enterprise)
  planTier: "basic"

# Namespace configuration
namespace: "default"
companyName: "mycompany"
deploymentType: "dedicated"
namespaceAnnotations: {}

# Ingress configuration
ingress:
  enabled: false
  name: "kubecost-ingress"
  className: "nginx"
  annotations: {}
  tls: []
  hosts: []

# GCP-specific configuration
gcp:
  backendConfig:
    enabled: false
    name: "backend-config"
    healthCheck:
      checkIntervalSec: 30

# Tier-based resource configuration
tierConfig:
  # Resource limits by tier
  basic:
    cpu: "2"
    memory: "4Gi"
    storage: "20Gi"
    maxReplicas: 2
  
  standard:
    cpu: "8"
    memory: "16Gi"
    storage: "100Gi"
    maxReplicas: 5
  
  premium:
    cpu: "32"
    memory: "64Gi"
    storage: "500Gi"
    maxReplicas: 10
  
  enterprise:
    cpu: "128"
    memory: "256Gi"
    storage: "2Ti"
    maxReplicas: 50

# Tier resources (used by templates)
tierResources:
  cpu: "1"
  memory: "2Gi"
  storage: "10Gi"

# Additional monitoring components
monitoring:
  # Enable additional monitoring stack
  enabled: false
  
  # Grafana configuration
  grafana:
    enabled: false
    adminPassword: "admin"
  
  # AlertManager configuration  
  alertmanager:
    enabled: false
  
  # Dashboards configuration
  dashboards:
    enabled: false
    grafana:
      enabled: false

# Security configuration
security:
  # Pod Security Standards
  podSecurityStandards:
    enforce: "restricted"
    audit: "restricted"
    warn: "restricted"
  
  # Network policies
  networkPolicies:
    enabled: false
    defaultDeny: false

# High availability configuration
ha:
  # Enable high availability mode
  enabled: false
  
  # Number of replicas for HA components
  replicas: 3

# Resource quotas by tier
resourceQuotas:
  basic:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
    persistentvolumeclaims: "10"
  
  standard:
    requests:
      cpu: "8"
      memory: "16Gi"
    limits:
      cpu: "16"
      memory: "32Gi"
    persistentvolumeclaims: "50"
  
  premium:
    requests:
      cpu: "32"
      memory: "64Gi"
    limits:
      cpu: "64"
      memory: "128Gi"
    persistentvolumeclaims: "200"
  
  enterprise:
    requests:
      cpu: "128"
      memory: "256Gi"
    limits:
      cpu: "256"
      memory: "512Gi"
    persistentvolumeclaims: "1000"

# Default node selectors and tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Pod disruption budgets
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Legacy application components (disabled for monitoring-only deployment)
redis:
  enabled: false
  
rafikiAuth:
  enabled: false
  hpa:
    enabled: false
  
rafikiBackend:
  enabled: false
  hpa:
    enabled: false
  
nginx:
  enabled: false
  hpa:
    enabled: false

# Default namespace (can be overridden)
namespace: default

# Company name for legacy templates
companyName: "mycompany"
