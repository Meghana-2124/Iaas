# Secrets configuration for iaas-rafiki Helm chart
# This file contains plain text secrets for development/testing purposes using stringData
# In production, these should be managed through external secret management systems

kubernetesSecrets:
  rafikiAuth:
    create: true
    name: rafiki-auth-secrets
    stringData:
      AUTH_DATABASE_URL: postgresql://user:pass@localhost:5432/db
      COOKIE_KEY: test-cookie-key
      IDENTITY_SERVER_SECRET: test-secret
      REDIS_URL: redis://localhost:6379
      INTERACTION_EXPIRY_SECONDS: 3600
      WAIT_TIME_SECONDS: 60

  rafikiBackend:
    create: true
    name: rafiki-backend-secrets
    stringData:
      DATABASE_URL: postgresql://user:pass@localhost:5432/backend
      ADMIN_KEY: test-admin-key
      STREAM_SECRET: test-stream-secret
      REDIS_URL: redis://localhost:6379
      ILP_ADDRESS: test.rafiki
      ILP_CONNECTOR_ADDRESS: test.rafiki.connector
      SIGNATURE_SECRET: test-backend-signature-secret
      SIGNATURE_VERSION: 1
      WEBHOOK_SECRET: test-webhook-secret
