# Secrets configuration for iaas-rafiki Helm chart
# This file contains base64-encoded secrets for development/testing purposes
# In production, these should be managed through external secret management systems

kubernetesSecrets:
  rafikiAuth:
    create: true
    name: rafiki-auth-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      RAFIKI_AUTH_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kYg==  # postgresql://user:pass@localhost:5432/db
      RAFIKI_AUTH_COOKIE_KEY: dGVzdC1jb29raWUta2V5  # test-cookie-key
      RAFIKI_AUTH_IDENTITY_SERVER_SECRET: dGVzdC1zZWNyZXQ=  # test-secret
      RAFIKI_AUTH_REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      RAFIKI_AUTH_SIGNATURE_SECRET: dGVzdC1zaWduYXR1cmUtc2VjcmV0  # test-signature-secret
      RAFIKI_AUTH_SIGNATURE_VERSION: MQ==  # 1
      RAFIKI_AUTH_INTERACTION_EXPIRY_SECONDS: MzYwMA==  # 3600
      RAFIKI_AUTH_WAIT_TIME_SECONDS: NjA=  # 60

  rafikiBackend:
    create: true
    name: rafiki-backend-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      RAFIKI_BACKEND_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9iYWNrZW5k  # postgresql://user:pass@localhost:5432/backend
      RAFIKI_BACKEND_ADMIN_KEY: dGVzdC1hZG1pbi1rZXk=  # test-admin-key
      RAFIKI_BACKEND_STREAM_SECRET: dGVzdC1zdHJlYW0tc2VjcmV0  # test-stream-secret
      RAFIKI_BACKEND_REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      RAFIKI_BACKEND_ILP_ADDRESS: dGVzdC5yYWZpa2k=  # test.rafiki
      RAFIKI_BACKEND_ILP_CONNECTOR_ADDRESS: dGVzdC5yYWZpa2kuY29ubmVjdG9y  # test.rafiki.connector
      RAFIKI_BACKEND_SIGNATURE_SECRET: dGVzdC1iYWNrZW5kLXNpZ25hdHVyZS1zZWNyZXQ=  # test-backend-signature-secret
      RAFIKI_BACKEND_SIGNATURE_VERSION: MQ==  # 1
      RAFIKI_BACKEND_WEBHOOK_SECRET: dGVzdC13ZWJob29rLXNlY3JldA==  # test-webhook-secret