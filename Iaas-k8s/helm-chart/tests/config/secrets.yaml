# Secrets configuration for iaas-rafiki Helm chart
# This file contains base64-encoded secrets for development/testing purposes
# In production, these should be managed through external secret management systems

kubernetesSecrets:
  rafikiAuth:
    create: true
    name: rafiki-auth-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      AUTH_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kYg==  # postgresql://user:pass@localhost:5432/db
      COOKIE_KEY: dGVzdC1jb29raWUta2V5  # test-cookie-key
      IDENTITY_SERVER_SECRET: dGVzdC1zZWNyZXQ=  # test-secret
      REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      INTERACTION_EXPIRY_SECONDS: MzYwMA==  # 3600
      WAIT_TIME_SECONDS: NjA=  # 60

  rafikiBackend:
    create: true
    name: rafiki-backend-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9iYWNrZW5k  # postgresql://user:pass@localhost:5432/backend
      ADMIN_KEY: dGVzdC1hZG1pbi1rZXk=  # test-admin-key
      STREAM_SECRET: dGVzdC1zdHJlYW0tc2VjcmV0  # test-stream-secret
      REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      ILP_ADDRESS: dGVzdC5yYWZpa2k=  # test.rafiki
      ILP_CONNECTOR_ADDRESS: dGVzdC5yYWZpa2kuY29ubmVjdG9y  # test.rafiki.connector
      SIGNATURE_SECRET: dGVzdC1iYWNrZW5kLXNpZ25hdHVyZS1zZWNyZXQ=  # test-backend-signature-secret
      SIGNATURE_VERSION: MQ==  # 1
      WEBHOOK_SECRET: dGVzdC13ZWJob29rLXNlY3JldA==  # test-webhook-secret