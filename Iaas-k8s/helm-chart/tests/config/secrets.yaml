# Secrets configuration for iaas-rafiki Helm chart
# This file contains base64-encoded secrets for development/testing purposes
# In production, these should be managed through external secret management systems

kubernetesSecrets:
  rafikiAuth:
    create: true
    name: rafiki-auth-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      RAFIKI_AUTH_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kYg==  # postgresql://user:pass@localhost:5432/db
      RAFIKI_AUTH_COOKIE_KEY: dGVzdC1jb29raWUta2V5  # test-cookie-key
      RAFIKI_AUTH_IDENTITY_SERVER_SECRET: dGVzdC1zZWNyZXQ=  # test-secret
      RAFIKI_AUTH_REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      RAFIKI_AUTH_SIGNATURE_SECRET: dGVzdC1zaWduYXR1cmUtc2VjcmV0  # test-signature-secret
      RAFIKI_AUTH_SIGNATURE_VERSION: MQ==  # 1
      RAFIKI_AUTH_INTERACTION_EXPIRY_SECONDS: MzYwMA==  # 3600
      RAFIKI_AUTH_WAIT_TIME_SECONDS: NjA=  # 60

  rafikiBackend:
    create: true
    name: rafiki-backend-secrets
    data:
      # Base64 encoded values for development/testing
      # For production, replace with actual base64-encoded secrets
      RAFIKI_BACKEND_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9iYWNrZW5k  # postgresql://user:pass@localhost:5432/backend
      RAFIKI_BACKEND_ADMIN_KEY: dGVzdC1hZG1pbi1rZXk=  # test-admin-key
      RAFIKI_BACKEND_STREAM_SECRET: dGVzdC1zdHJlYW0tc2VjcmV0  # test-stream-secret
      RAFIKI_BACKEND_REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
      RAFIKI_BACKEND_ILP_ADDRESS: dGVzdC5yYWZpa2k=  # test.rafiki
      RAFIKI_BACKEND_ILP_CONNECTOR_ADDRESS: dGVzdC5yYWZpa2kuY29ubmVjdG9y  # test.rafiki.connector
      RAFIKI_BACKEND_SIGNATURE_SECRET: dGVzdC1iYWNrZW5kLXNpZ25hdHVyZS1zZWNyZXQ=  # test-backend-signature-secret
      RAFIKI_BACKEND_SIGNATURE_VERSION: MQ==  # 1
      RAFIKI_BACKEND_WEBHOOK_SECRET: dGVzdC13ZWJob29rLXNlY3JldA==  # test-webhook-secret

  # TLS secrets for ingress (if using cert-manager or manual certificate management)
  tls:
    create: false  # Set to true if managing TLS secrets through Helm
    name: rafiki-tls-secret
    data:
      # These would be the actual certificate and key in base64
      tls.crt: ""  # Base64 encoded certificate
      tls.key: ""  # Base64 encoded private key

# Secret generation utilities (for reference/documentation)
secretGeneration:
  # Example commands to generate base64-encoded secrets:
  # 
  # Generate a random cookie key:
  # openssl rand -base64 32 | base64 -w 0
  # 
  # Generate a random admin key:
  # openssl rand -hex 32 | base64 -w 0
  # 
  # Generate a stream secret:
  # openssl rand -base64 24 | base64 -w 0
  # 
  # Generate signature secret:
  # openssl rand -base64 32 | base64 -w 0
  # 
  # Base64 encode a string:
  # echo -n "your-string-here" | base64 -w 0
  #
  # Decode a base64 string:
  # echo "base64-string-here" | base64 -d

# Production secret management examples
productionSecrets:
  aws:
    # Use AWS Secrets Manager
    # secretsManager:
    #   enabled: true
    #   region: us-west-2
    #   secretName: "rafiki/production/secrets"
    
    # Use External Secrets Operator with AWS
    # externalSecrets:
    #   enabled: true
    #   secretStore:
    #     name: aws-secrets-manager
    #     kind: SecretStore
    
  gcp:
    # Use Google Secret Manager
    # secretManager:
    #   enabled: true
    #   projectId: "my-project-id"
    #   secretName: "rafiki-production-secrets"
    
    # Use External Secrets Operator with GCP
    # externalSecrets:
    #   enabled: true
    #   secretStore:
    #     name: gcp-secret-manager
    #     kind: SecretStore

# Environment-specific secret overrides
environments:
  development:
    rafikiAuth:
      RAFIKI_AUTH_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kZXZfZGI=  # postgresql://user:pass@localhost:5432/dev_db
    rafikiBackend:
      RAFIKI_BACKEND_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kZXZfYmFja2VuZA==  # postgresql://user:pass@localhost:5432/dev_backend
  
  staging:
    rafikiAuth:
      RAFIKI_AUTH_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BzdGFnaW5nLWRiOjU0MzIvZGI=  # postgresql://user:pass@staging-db:5432/db
    rafikiBackend:
      RAFIKI_BACKEND_DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BzdGFnaW5nLWRiOjU0MzIvYmFja2VuZA==  # postgresql://user:pass@staging-db:5432/backend
  
  production:
    # Production secrets should never be stored in version control
    # Use external secret management systems instead
    rafikiAuth:
      RAFIKI_AUTH_DATABASE_URL: ""  # Provide via external secret management
    rafikiBackend:
      RAFIKI_BACKEND_DATABASE_URL: ""  # Provide via external secret management
  #
  # Encode database URL:
  # echo -n "postgresql://username:password@host:port/database" | base64 -w 0
  #
  # Generate admin key:
  # openssl rand -hex 32 | base64 -w 0
  #
  # Generate stream secret:
  # openssl rand -base64 24 | base64 -w 0

# Notes for secret management:
# 1. This file is for development/testing only
# 2. For production, use external secret management
# 3. Rotate secrets regularly
# 4. Use strong, randomly generated secrets
# 5. Never commit real production secrets to version control
# 6. Consider using tools like git-crypt or git-secret for encrypted storage
# 7. Implement proper RBAC for secret access
# 8. Monitor secret access and usage
